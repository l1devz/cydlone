<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap | Cydlone</title>
  <script src="/js/i18n.js"></script>
  <link rel="icon" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <div class="brand-corner"><img src="/img/logo.svg" alt="" width="34" height="34"> Cydlone</div>
  <div id="lang-picker" class="lang-corner"></div>

  <main class="auth-card wide">
    <div class="form-col">
      <h1>Tekrar hoş geldin!</h1>
      <p class="subtitle">Seni tekrar gördüğümüze çok sevindik!</p>

      <form id="login-form" novalidate>
        <div class="form-error" id="form-error"></div>

        <div class="field" data-field="login">
          <label for="login">E-posta veya kullanıcı adı#etiket<span class="req">*</span> <span class="err"></span></label>
          <input class="input" id="login" name="login" autocomplete="username" required autofocus>
        </div>

        <div class="field" data-field="password">
          <label for="password">Şifre<span class="req">*</span> <span class="err"></span></label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <a href="#" class="link-small" id="forgot">Şifreni mi unuttun?</a>
        </div>

        <button class="btn-primary" type="submit">Giriş Yap</button>
        <div class="switch">Bir hesaba mı ihtiyacın var? <a href="/register">Kaydol</a></div>
      </form>
    </div>

    <aside class="qr-col">
      <div class="qr-box">
        <svg id="qr" viewBox="0 0 25 25" shape-rendering="crispEdges"></svg>
        <img class="qr-logo" src="/img/logo.svg" alt="">
      </div>
      <h2>QR Kodu ile Giriş Yap</h2>
      <p>Anında giriş yapmak için bu kodu <strong>Cydlone mobil uygulamasıyla</strong> tara. (Yakında)</p>
    </aside>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    Auth.drawQr(document.getElementById('qr'));
    Auth.bindForm(document.getElementById('login-form'), '/api/auth/login', (f) => ({
      login: f.login.value,
      password: f.password.value,
    }));
    document.getElementById('forgot').addEventListener('click', (e) => {
      e.preventDefault();
      Auth.showFormError('Şifre sıfırlama henüz hazır değil.');
    });
  </script>
</body>
</html>
